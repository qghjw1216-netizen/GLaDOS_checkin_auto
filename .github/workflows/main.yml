name: 开始每日签到

on:
  workflow_dispatch:
  schedule:
    # UTC 1点30分(北京时间 9点30分)
    - cron: 30 1 * * *
  # 标星时触发工作流程
  watch:
    types: [started]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Run checkin
        run: |
          echo "run_date: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')" | tee checkin_output.txt
          python3 glados.py | tee -a checkin_output.txt
        env:
          GLADOS_COOKIE: "${{ secrets.QIANDAO }}"
      - name: Save checkin result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checkin_output.txt
          git diff --cached --quiet || git commit -m "Update checkin result"
          git push
